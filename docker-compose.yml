version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hotels-vendors-db
    environment:
      POSTGRES_USER: hotels_vendors
      POSTGRES_PASSWORD: hotels_vendors_dev
      POSTGRES_DB: hotels_vendors
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotels_vendors -d hotels_vendors"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotels-vendors-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Ollama — Local LLM Engine (Dev) ──
  ollama:
    image: ollama/ollama:latest
    container_name: hotels-vendors-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  ollama_data:
