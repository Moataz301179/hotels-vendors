name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint (non-blocking — pre-existing warnings across project)
        run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SESSION_SECRET: "dummy-for-ci-build-only"
          DATABASE_URL: "postgresql://dummy:***@localhost:5432/dummy"
          HOTELSVENDORS_HMAC_SECRET: "dummy-hmac-secret-for-ci-build-only-32chars-minimum"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

  deploy-hostinger:
    name: Deploy to Hostinger VPS (PM2)
    needs: [ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (PM2)
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'SCRIPT'
            set -e
            echo "======== HotelsVendors Production Deploy ========"
            cd /var/www/hotelsvendors-v2

            echo "[1/7] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/7] Installing dependencies..."
            npm ci --legacy-peer-deps

            echo "[3/7] Generating Prisma client..."
            npx prisma generate

            echo "[4/7] Building application (standalone)..."
            NEXT_TELEMETRY_DISABLED=1 npm run build

            echo "[5/7] Copying static assets to standalone..."
            # Ensure public/ is in standalone dir (Next.js should do this, but verify)
            if [ ! -d .next/standalone/public ]; then
              cp -r public .next/standalone/public
            fi
            # Copy .env to standalone dir for server.js to load at startup
            if [ ! -f .next/standalone/.env ]; then
              cp .env .next/standalone/.env 2>/dev/null || true
            fi

            echo "[6/7] Restarting PM2 process..."
            pm2 reload ecosystem.config.js --env production 2>/dev/null || pm2 start ecosystem.config.js --env production
            pm2 save

            echo "[7/7] Health checks..."
            sleep 15
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3003/api/health || echo "000")
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "  ERROR: Health check failed (HTTP $HTTP_STATUS)"
              pm2 logs hotels-vendors --lines 30
              exit 1
            fi
            echo "  Health: HTTP $HTTP_STATUS"
            echo "======== Deploy Complete ========"
          SCRIPT

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "  WARNING: Health check returned HTTP $HTTP_STATUS — check server logs"
          fi
