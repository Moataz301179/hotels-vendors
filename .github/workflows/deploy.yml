name: "Production Deploy — HotelsVendors"

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: "/var/www/hotels-vendors"
  APP_NAME: "hotels-vendors"

jobs:
  validate:
    name: "Validate Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma validate

  deploy:
    name: "Deploy to Hostinger"
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx prisma generate
      - run: npm run build

      - name: "Prepare deployment archive"
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          echo "RELEASE_TAG=$TIMESTAMP" >> $GITHUB_ENV
          tar -czf /tmp/deploy-release.tar.gz 
            standalone/ 
            prisma/ 
            ecosystem.config.js 
            package.json 
            next.config.ts

      - name: "Setup SSH"
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          known_hosts: ${{ secrets.HOSTINGER_KNOWN_HOSTS || '' }}
          config: |
            Host hostinger
              HostName ${{ secrets.HOSTINGER_HOST }}
              User ${{ secrets.HOSTINGER_USER }}
              Port ${{ secrets.HOSTINGER_PORT || 22 }}

      - name: "Deploy to VPS"
        run: |
          RELEASE="${{ env.RELEASE_TAG }}"
          RELEASE_DIR="${{ env.DEPLOY_PATH }}/releases/${RELEASE}"
          SHARED_DIR="${{ env.DEPLOY_PATH }}/shared"
          
          ssh hostinger "mkdir -p ${RELEASE_DIR} ${SHARED_DIR}/logs"
          scp /tmp/deploy-release.tar.gz hostinger:${RELEASE_DIR}/release.tar.gz
          
          ssh hostinger << 'REMOTE_SCRIPT'
            set -euo pipefail
            RELEASE_DIR="${{ env.DEPLOY_PATH }}/releases/${{ env.RELEASE_TAG }}"
            SHARED_DIR="${{ env.DEPLOY_PATH }}/shared"
            
            cd ${RELEASE_DIR}
            tar -xzf release.tar.gz
            rm release.tar.gz
            
            # Symlink .env from shared
            ln -sfn ${SHARED_DIR}/.env ${RELEASE_DIR}/.env
            
            # Move standalone content to root of release for simpler PM2 start
            cp -r standalone/. ${RELEASE_DIR}/
            rm -rf standalone
            
            # Generate Prisma Client for the production environment
            npx prisma generate
            npx prisma migrate deploy
            
            # Atomic symlink swap
            ln -sfn ${RELEASE_DIR} ${{ env.DEPLOY_PATH }}/current
            
            # Restart Application
            cd ${{ env.DEPLOY_PATH }}/current
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
            pm2 save
            
            # Cleanup old releases
            cd ${{ env.DEPLOY_PATH }}/releases
            ls -t | tail -n +6 | xargs -r rm -rf
          REMOTE_SCRIPT

      - name: "Health check"
        run: |
          sleep 15
          curl -sfI https://www.hotelsvendors.com/api/health || echo "Health check failed"
