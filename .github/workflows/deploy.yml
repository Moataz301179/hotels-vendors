name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint (non-blocking — pre-existing warnings across project)
        run: npm run lint
        continue-on-error: true
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SESSION_SECRET: "dummy-for-ci-build-only"
          DATABASE_URL: "postgresql://dummy:***@localhost:5432/dummy"
          HOTELSVENDORS_HMAC_SECRET: "dummy-hmac-secret-for-ci-build-only-32chars-minimum"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_APP_URL: "https://www.hotelsvendors.com"

  deploy-hostinger:
    name: Deploy to Hostinger VPS (PM2)
    needs: [ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          # Tolerant keyscan — transient network/DNS failures must not kill the deploy.
          # The ssh command below uses StrictHostKeyChecking=accept-new as the reliable fallback.
          (ssh-keyscan -T 10 -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts 2>/dev/null) || true

      - name: Deploy to VPS (PM2)
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'DEPLOYSCRIPT'
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Production Deploy"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: PM2 + Next.js Standalone"
            echo "═══════════════════════════════════════════"

            cd /var/www/hotelsvendors-v2

            echo "[1/6] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            # VPS is a deployment target, not a development workspace.
            # Remove stale/untracked application source so old routes cannot enter
            # the production build after git reset. Preserve ignored runtime files.
            echo "  Cleaning stale untracked application source..."
            git clean -fd -- app

            APP_DIR=/var/www/hotelsvendors-v2
            if [ ! -d "$APP_DIR" ]; then
              echo "  ERROR: app dir $APP_DIR missing"
              exit 1
            fi
            cd "$APP_DIR"

            echo "[2/6] Installing dependencies..."
            if ! npm ci --legacy-peer-deps; then
              echo "  ERROR: npm ci failed"
              exit 1
            fi

            echo "[3/6] Setting up environment variables..."
            # Write ALL required env vars from GitHub secrets
            # This ensures build has what it needs regardless of .env state
            cat > .env << ENVEOF
            SESSION_SECRET=${{ secrets.SESSION_SECRET }}
            HOTELSVENDORS_HMAC_SECRET=${{ secrets.HOTELSVENDORS_HMAC_SECRET }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ENCRYPTION_MASTER_KEY=${{ secrets.ENCRYPTION_MASTER_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NODE_ENV=production
            ENVEOF
            echo "  Wrote .env with $(grep -c . .env 2>/dev/null || echo 0) variables"
            set -a
            source .env
            set +a

            echo "[4/6] Generating Prisma client..."
            npx prisma generate

            echo "[5/6] Applying Prisma migrations..."
            npx prisma migrate deploy

            echo "[6/6] Building application (standalone)..."
            # Rebuild from a clean Next.js output so stale chunks cannot survive a deploy.
            rm -rf .next
            if ! NEXT_TELEMETRY_DISABLED=1 npm run build; then
              echo "  ERROR: Production build failed — aborting deploy"
              exit 1
            fi

            # Verify the build produced static assets before we touch anything.
            if [ ! -d .next/static ] || [ -z "$(ls -A .next/static 2>/dev/null)" ]; then
              echo "  ERROR: Build produced no static assets"
              exit 1
            fi

            echo "─── Post-build setup ───"
            # Kill any orphaned Next server holding the port
            fuser -k 3003/tcp 2>/dev/null || true
            pkill -f 'next-server' 2>/dev/null || true
            sleep 2

            # Always synchronize the freshly built assets into standalone.
            # Never rely on destination existence: stale hashed chunks cause browser skeletons.
            # Copy to BOTH locations: Nginx serves /_next/static/ from standalone/static/,
            # and the Next.js server serves from standalone/.next/static/.
            rm -rf .next/standalone/static
            rm -rf .next/standalone/.next/static
            mkdir -p .next/standalone
            mkdir -p .next/standalone/.next
            if [ -d .next/static ]; then
              cp -a .next/static/. .next/standalone/static/
              cp -a .next/static/. .next/standalone/.next/static/
            fi

            rm -rf .next/standalone/public
            rm -rf .next/standalone/.next/public
            if [ -d public ]; then
              cp -a public/. .next/standalone/public/
              mkdir -p .next/standalone/.next
              cp -a public/. .next/standalone/.next/public/
            fi

            echo "─── Restarting PM2 ───"
            if pm2 describe hotels-vendors > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi
            pm2 save

            echo "─── Health checks ───"
            sleep 15
            APP_STATUS=$(pm2 describe hotels-vendors 2>/dev/null | grep -c "online" || echo "0")
            if [ "$APP_STATUS" -eq 0 ]; then
              echo "  ERROR: PM2 process not running"
              pm2 logs hotels-vendors --lines 50
              exit 1
            fi
            echo "  App: online (PM2)"

            echo "═══════════════════════════════════════════"
            echo "  Deploy Complete"
            echo "═══════════════════════════════════════════"
          DEPLOYSCRIPT

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "  WARNING: Health check returned HTTP $HTTP_STATUS"
          fimktemp(67995) MallocStackLogging: could not tag MSL-related memory as no_footprint, so those pages will be included in process footprint - No such file or directory (2)
