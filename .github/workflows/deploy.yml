name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint (non-blocking — pre-existing warnings across project)
        run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hotels-vendors
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-hostinger:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest
    needs: [build-docker]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (Docker Compose)
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'EOF'
            set -e
            echo "  Hotels Vendors — Auto Deploy Started"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: Docker Compose"

            cd /var/www/hotelsvendors-v2

            echo "[1/6] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/6] Stopping old containers (free ports)..."
            docker compose -f docker-compose.swarm.yml down 2>/dev/null || true

            echo "[3/6] Building all services..."
            docker compose -f docker-compose.swarm.yml build --no-cache

            echo "[4/6] Running Prisma migrations..."
            docker compose -f docker-compose.swarm.yml run --rm app npx prisma migrate deploy

            echo "[5/6] Starting full stack..."
            docker compose -f docker-compose.swarm.yml up -d

            echo "[6/6] Health checks..."
            sleep 15
            APP_STATUS=$(docker inspect --format='{{.State.Status}}' hv-app 2>/dev/null || echo "unknown")
            WORKER_STATUS=$(docker inspect --format='{{.State.Status}}' hv-swarm-worker 2>/dev/null || echo "unknown")
            echo "  App:     $APP_STATUS"
            echo "  Worker:  $WORKER_STATUS"

            if [ "$APP_STATUS" != "running" ]; then
              echo "  ERROR: App container not running — triggering rollback"
              docker compose -f docker-compose.swarm.yml logs --tail=50 hv-app
              exit 1
            fi

            echo "  Deploy Complete"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "  WARNING: Health check returned HTTP $HTTP_STATUS — check server logs"
          fi
