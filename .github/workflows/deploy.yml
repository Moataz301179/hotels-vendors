name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint (non-blocking — pre-existing warnings across project)
        run: npm run lint
        continue-on-error: true
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SESSION_SECRET: "dummy-for-ci-build-only"
          DATABASE_URL: "postgresql://dummy:***@localhost:5432/dummy"
          HOTELSVENDORS_HMAC_SECRET: "dummy-hmac-secret-for-ci-build-only-32chars-minimum"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_APP_URL: "https://www.hotelsvendors.com"

  deploy-hostinger:
    name: Deploy to Hostinger VPS (PM2)
    needs: [ci]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          # Tolerant keyscan — transient network/DNS failures must not kill the deploy.
          # The ssh command below uses StrictHostKeyChecking=accept-new as the reliable fallback.
          (ssh-keyscan -T 10 -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts 2>/dev/null) || true

      - name: Prepare deployment environment
        run: |
          mkdir -p /tmp/deploy-env
          cat > /tmp/deploy-env/.env << 'ENVEOF'
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          HOTELSVENDORS_HMAC_SECRET=${{ secrets.HOTELSVENDORS_HMAC_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ENCRYPTION_MASTER_KEY=${{ secrets.ENCRYPTION_MASTER_KEY }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
          NODE_ENV=production
          ENVEOF
          scp -o StrictHostKeyChecking=accept-new /tmp/deploy-env/.env ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }}:/var/www/hotelsvendors-v2/.env
          echo "  .env transferred to VPS"

      - name: Stamp and synchronize canonical release source
        run: |
          mkdir -p public
          printf '{"commit":"%s","deployedAt":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/release.json
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' --exclude '.git' \
            --exclude 'node_modules' --exclude '.next' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }}:/var/www/hotelsvendors-v2/
          echo "  Canonical source synchronized: ${{ github.sha }}"

      - name: Deploy to VPS (PM2)
        run: |
          OUTPUT=$(ssh -o StrictHostKeyChecking=accept-new ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'DEPLOYSCRIPT'
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Production Deploy"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: PM2 + Next.js Standalone"
            echo "═══════════════════════════════════════════"

            cd /var/www/hotelsvendors-v2

            set -euo pipefail

            echo "[1/6] Canonical source synchronized by GitHub Actions."

            # VPS is a deployment target, not a development workspace.
            # Remove stale/untracked application source so old routes cannot enter
            # the production build after git reset. Preserve ignored runtime files.
            echo "  Source cleanup completed during rsync."
            true

            APP_DIR=/var/www/hotelsvendors-v2
            if [ ! -d "$APP_DIR" ]; then
              echo "  ERROR: app dir $APP_DIR missing"
              exit 1
            fi
            cd "$APP_DIR"

            echo "[2/6] Installing dependencies..."
            if ! npm ci --legacy-peer-deps; then
              echo "  ERROR: npm ci failed"
              exit 1
            fi

            echo "[3/6] Validating environment variables..."
            test -s .env || { echo "  ERROR: .env is missing or empty"; exit 1; }
            echo "  .env validated ($(wc -l < .env) lines)"
            set -a
            source .env
            set +a

            echo "[4/6] Generating Prisma client..."
            npx prisma generate

            echo "[5/6] Applying Prisma migrations..."
            npx prisma migrate deploy

            echo "[6/6] Building application (standalone)..."
            # Rebuild from a clean Next.js output so stale chunks cannot survive a deploy.
            rm -rf .next
            if ! NEXT_TELEMETRY_DISABLED=1 npm run build; then
              echo "  ERROR: Production build failed — aborting deploy"
              exit 1
            fi

            # Verify the build produced static assets before we touch anything.
            if [ ! -d .next/static ] || [ -z "$(ls -A .next/static 2>/dev/null)" ]; then
              echo "  ERROR: Build produced no static assets"
              exit 1
            fi

            echo "─── Post-build setup ───"
            # Kill any orphaned Next server holding the port
            fuser -k 3003/tcp 2>/dev/null || true
            pkill -f 'next-server' 2>/dev/null || true
            sleep 2

            # Always synchronize the freshly built assets into standalone.
            # Never rely on destination existence: stale hashed chunks cause browser skeletons.
            # Copy to BOTH locations: Nginx serves /_next/static/ from standalone/static/,
            # and the Next.js server serves from standalone/.next/static/.
            rm -rf .next/standalone/static
            rm -rf .next/standalone/.next/static
            mkdir -p .next/standalone
            mkdir -p .next/standalone/.next
            if [ -d .next/static ]; then
              cp -a .next/static/. .next/standalone/static/
              cp -a .next/static/. .next/standalone/.next/static/
            fi

            rm -rf .next/standalone/public
            rm -rf .next/standalone/.next/public
            if [ -d public ]; then
              cp -a public/. .next/standalone/public/
              mkdir -p .next/standalone/.next
              cp -a public/. .next/standalone/.next/public/
            fi

            echo "─── Restarting PM2 ───"
            if pm2 describe hotels-vendors > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi
            pm2 save

            echo "─── Verifying asset visibility on VPS ───"
            # Confirm the files are actually present where Nginx and the Next.js
            # standalone server can serve them. This catches copy failures that
            # the GitHub Actions runner cannot observe directly.
            STATIC_COUNT=$(find .next/standalone/static -type f 2>/dev/null | wc -l || echo "0")
            NEXT_STATIC_COUNT=$(find .next/standalone/.next/static -type f 2>/dev/null | wc -l || echo "0")
            PUBLIC_COUNT=$(find .next/standalone/public -type f 2>/dev/null | wc -l || echo "0")
            echo "  standalone/static/       : $STATIC_COUNT files"
            echo "  standalone/.next/static/ : $NEXT_STATIC_COUNT files"
            echo "  standalone/public/       : $PUBLIC_COUNT files"
            if [ "$STATIC_COUNT" -eq 0 ] && [ "$NEXT_STATIC_COUNT" -eq 0 ]; then
              echo "  ERROR: No static assets were copied to either standalone location"
              ls -la .next/static/ 2>/dev/null || echo "  .next/static/ is missing entirely"
              exit 1
            fi
            if [ "$PUBLIC_COUNT" -eq 0 ]; then
              echo "  WARNING: No public/ assets were copied (brand images may be missing)"
            fi

            echo "─── Reloading Nginx ───"
            # Ensure Nginx picks up any new static files without waiting for its
            # own reload cycle.
            if command -v nginx > /dev/null 2>&1; then
              if nginx -t 2>/dev/null; then
                nginx -s reload 2>/dev/null || true
                echo "  Nginx reloaded"
              else
                echo "  WARNING: nginx -t failed, skipping reload"
              fi
            else
              echo "  WARNING: nginx binary not found on PATH"
            fi

            echo "─── Health checks ───"
            sleep 15
            APP_STATUS=$(pm2 describe hotels-vendors 2>/dev/null | grep -c "online" || echo "0")
            if [ "$APP_STATUS" -eq 0 ]; then
              echo "  ERROR: PM2 process not running"
              pm2 logs hotels-vendors --lines 50
              exit 1
            fi
            echo "  App: online (PM2)"

            LOCAL_RELEASE=$(curl -fsS --retry 3 http://127.0.0.1:3003/release.json)
            if ! printf '%s' "$LOCAL_RELEASE" | grep -Fq '${{ github.sha }}'; then
              echo "  ERROR: PM2 is not serving the synchronized release"
              exit 1
            fi
            echo "  PM2 release identity confirmed"

            echo "HV_DEPLOY_COMPLETE"

            echo "═══════════════════════════════════════════"
            echo "  Deploy Complete"
            echo "═══════════════════════════════════════════"
          DEPLOYSCRIPT
          )
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "HV_DEPLOY_COMPLETE"; then
            echo "ERROR: Deployment did not complete — HV_DEPLOY_COMPLETE not found in output"
            exit 1
          fi
          echo "Deployment sentinel confirmed."

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "  ERROR: Health check returned HTTP $HTTP_STATUS"
            exit 1
          fi

          LIVE_RELEASE=$(curl -fsS --retry 3 https://www.hotelsvendors.com/release.json)
          if ! printf '%s' "$LIVE_RELEASE" | grep -Fq '${{ github.sha }}'; then
            echo "  ERROR: Public domain is not serving deployed commit ${{ github.sha }}"
            exit 1
          fi

          if ! curl -fsS --retry 3 https://www.hotelsvendors.com/ | grep -Fq 'Supplier payments in 48 hours'; then
            echo "  ERROR: Public domain is not serving the expected canonical homepage"
            exit 1
          fi

          echo "  Public release identity and canonical homepage confirmed."
