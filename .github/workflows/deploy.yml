name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_BPnTu1FgLycQZWzwLboum1Kz
  VERCEL_PROJECT_ID: prj_HOlS5yFTfBlqxVxE9WcQv4enu44A

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Vercel project config
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json << 'EOF'
          {"projectId":"prj_HOlS5yFTfBlqxVxE9WcQv4enu44A","orgId":"team_BPnTu1FgLycQZWzwLboum1Kz"}
          EOF

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
