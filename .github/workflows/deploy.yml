name: Deploy to Production (PM2)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  deploy-hostinger:
    name: Deploy to Hostinger VPS (PM2)
    runs-on: ubuntu-latest
    needs: [ci]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS with checkpoints
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} 'bash -se' << 'EOF' | tee deploy-remote.log
            set -euo pipefail
            APP_DIR="/var/www/hotelsvendors-v2"
            APP_NAME="hotels-vendors"

            echo "[checkpoint 1/8] Enter app directory"
            cd "/var/www/hotelsvendors-v2"

            echo "[checkpoint 2/8] Sync main"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git rev-parse --short HEAD

            echo "[checkpoint 3/8] Install dependencies"
            npm ci --legacy-peer-deps

            echo "[checkpoint 4/8] Prisma generate"
            npx prisma generate

            echo "[checkpoint 5/8] Prisma migrate deploy"
            npx prisma migrate deploy

            echo "[checkpoint 6/8] Build"
            NEXT_TELEMETRY_DISABLED=1 npm run build

            echo "[checkpoint 7/8] PM2 reload"
            pm2 reload ecosystem.config.js --env production
            pm2 save
            pm2 status "$APP_NAME"

            echo "[checkpoint 8/8] Local health"
            code=$(curl -s -o /tmp/hv-local-health.json -w "%{http_code}" http://127.0.0.1:3003/api/health || echo "000")
            echo "local_health=$code"
            if [ "$code" != "200" ]; then
              echo "Local health check failed"
              tail -n 80 /tmp/hv-local-health.json 2>/dev/null || true
              exit 1
            fi
          EOF

      - name: Verify public health
        run: |
          HTTP_STATUS=$(curl -s -o deploy-health.json -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          echo "public_health=$HTTP_STATUS" | tee -a deploy-remote.log
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Public health check failed with HTTP $HTTP_STATUS"
            cat deploy-health.json || true
            exit 1
          fi

      - name: Collect remote diagnostics on failure
        if: failure()
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} 'bash -se' << 'EOF' > deploy-diagnostics.log
            set -euo pipefail
            APP_DIR="/var/www/hotelsvendors-v2"
            APP_NAME="hotels-vendors"
            cd "$APP_DIR"
            echo "=== git status ==="
            git status --short || true
            echo "=== git head ==="
            git rev-parse --short HEAD || true
            echo "=== pm2 status ==="
            pm2 status "$APP_NAME" || true
            echo "=== pm2 recent logs ==="
            pm2 logs "$APP_NAME" --lines 120 --nostream || true
            echo "=== local health ==="
            curl -s -i http://127.0.0.1:3003/api/health || true
          EOF

      - name: Upload deploy logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs-${{ github.run_id }}
          path: |
            deploy-remote.log
            deploy-health.json
            deploy-diagnostics.log
          if-no-files-found: warn
