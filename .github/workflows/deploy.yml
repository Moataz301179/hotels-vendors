name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual deploy"
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Lint (non-blocking — pre-existing warnings across project)
        run: npm run lint
        continue-on-error: true
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx prisma generate
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          SESSION_SECRET: "dummy-for-ci-build-only"
          DATABASE_URL: "postgresql://dummy:***@localhost:5432/dummy"
          HOTELSVENDORS_HMAC_SECRET: "dummy-hmac-secret-for-ci-build-only-32chars-minimum"
          ENCRYPTION_MASTER_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NEXT_PUBLIC_APP_URL: "https://www.hotelsvendors.com"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_dW5pdGVkLXRyZWVmcm9nLTIyMy5jbGVyay5hY2NvdW50cy5kZXYk"

  deploy-hostinger:
    name: Deploy to Hostinger VPS (PM2)
    needs: [ci]
    # Production is protected while the platform consolidation is being rebuilt.
    # Set the repository/environment variable PRODUCTION_RELEASE_READY=true only
    # after database, application, migration, security, and live smoke tests pass.
    if: ${{ vars.PRODUCTION_RELEASE_READY == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          (ssh-keyscan -T 10 -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts 2>/dev/null) || true

      - name: Prepare deployment environment
        run: |
          ENV_STATE=$(ssh -o StrictHostKeyChecking=accept-new ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} '
            mkdir -p /var/www/hv-release-production
            if [ -s /var/www/hv-release-production/.env ] &&
               grep -q "^DATABASE_URL=" /var/www/hv-release-production/.env &&
               ! grep -q "^DATABASE_URL=.*localhost" /var/www/hv-release-production/.env; then
              echo PRESERVE
            elif [ -s /var/www/hv-release-13028baf/.env ] &&
                 grep -q "^DATABASE_URL=" /var/www/hv-release-13028baf/.env &&
                 ! grep -q "^DATABASE_URL=.*localhost" /var/www/hv-release-13028baf/.env; then
              cp /var/www/hv-release-13028baf/.env /var/www/hv-release-production/.env
              echo RESTORED
            else
              echo NEED_ENV
            fi
          ')
          echo "  VPS environment state: $ENV_STATE"

          if echo "$ENV_STATE" | grep -q NEED_ENV; then
            mkdir -p /tmp/deploy-env
            cat > /tmp/deploy-env/.env << 'ENVEOF'
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          HOTELSVENDORS_HMAC_SECRET=${{ secrets.HOTELSVENDORS_HMAC_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ENCRYPTION_MASTER_KEY=${{ secrets.ENCRYPTION_MASTER_KEY }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          NEXT_PUBLIC_APP_URL=https://www.hotelsvendors.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dW5pdGVkLXRyZWVmcm9nLTIyMy5jbGVyay5hY2NvdW50cy5kZXYk
          NODE_ENV=production
          ENVEOF
            scp -o StrictHostKeyChecking=accept-new /tmp/deploy-env/.env ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }}:/var/www/hv-release-production/.env
            echo "  Created production .env from GitHub secrets"
          else
            echo "  Kept a known-good VPS production .env"
          fi

      - name: Stamp and synchronize production release source
        run: |
          mkdir -p public
          printf '{"commit":"%s","deployedAt":"%s"}\n' \
            "${{ github.sha }}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/release.json
          rsync -az --delete \
            --exclude '.env' --exclude '.env.*' --exclude '.git' \
            --exclude 'node_modules' --exclude '.next' \
            -e "ssh -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }}:/var/www/hv-release-production/
          echo "  Production source synchronized: ${{ github.sha }}"

      - name: Deploy to VPS (PM2)
        run: |
          OUTPUT=$(ssh -o StrictHostKeyChecking=accept-new ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'DEPLOYSCRIPT'
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Production Deploy"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: PM2 + Next.js Standalone"
            echo "═══════════════════════════════════════════"

            cd /var/www/hv-release-production

            set -euo pipefail

            echo "[1/6] Production source synchronized by GitHub Actions."

            echo "  Source cleanup completed during rsync."
            true

            APP_DIR=/var/www/hv-release-production
            if [ ! -d "$APP_DIR" ]; then
              echo "  ERROR: app dir $APP_DIR missing"
              exit 1
            fi
            cd "$APP_DIR"

            echo "[2/6] Installing dependencies..."
            if ! npm ci --legacy-peer-deps; then
              echo "  ERROR: npm ci failed"
              exit 1
            fi

            echo "[3/6] Validating environment variables..."
            test -s .env || { echo "  ERROR: .env is missing or empty"; exit 1; }
            echo "  .env validated ($(wc -l < .env) lines)"
            set -a
            source .env
            set +a

            echo "[4/6] Generating Prisma client..."
            npx prisma generate

            echo "[5/6] Applying Prisma migrations..."
            npx prisma migrate deploy

            echo "[6/6] Building application (standalone)..."
            rm -rf .next
            if ! NEXT_TELEMETRY_DISABLED=1 npm run build; then
              echo "  ERROR: Production build failed — aborting deploy"
              exit 1
            fi

            if [ ! -d .next/static ] || [ -z "$(ls -A .next/static 2>/dev/null)" ]; then
              echo "  ERROR: Build produced no static assets"
              exit 1
            fi

            echo "─── Restarting PM2 ───"
            pm2 delete hotels-vendors-production >/dev/null 2>&1 || true
            pm2 delete hotels-vendors-13028-3008 >/dev/null 2>&1 || true
            fuser -k 3008/tcp 2>/dev/null || true
            sleep 2
            PORT=3008 NODE_ENV=production NEXT_TELEMETRY_DISABLED=1 pm2 start npm --name hotels-vendors-production --cwd "$APP_DIR" -- start
            pm2 save

            echo "─── Verifying public build assets ───"
            STATIC_COUNT=$(find .next/static -type f 2>/dev/null | wc -l || echo "0")
            PUBLIC_COUNT=$(find public -type f 2>/dev/null | wc -l || echo "0")
            echo "  .next/static/ : $STATIC_COUNT files"
            echo "  public/       : $PUBLIC_COUNT files"
            if [ "$STATIC_COUNT" -eq 0 ]; then
              echo "  ERROR: No Next.js static assets exist"
              exit 1
            fi

            echo "─── Reloading Nginx ───"
            if command -v nginx > /dev/null 2>&1; then
              if nginx -t 2>/dev/null; then
                nginx -s reload 2>/dev/null || true
                echo "  Nginx reloaded"
              else
                echo "  WARNING: nginx -t failed, skipping reload"
              fi
            fi

            echo "─── Health checks ───"
            sleep 15
            APP_STATUS=$(pm2 describe hotels-vendors-production 2>/dev/null | grep -c "online" || echo "0")
            if [ "$APP_STATUS" -eq 0 ]; then
              echo "  ERROR: PM2 process not running"
              pm2 logs hotels-vendors-production --lines 50
              exit 1
            fi
            echo "  App: online (PM2)"

            LOCAL_RELEASE=$(curl -fsS --retry 3 http://127.0.0.1:3008/release.json)
            if ! printf '%s' "$LOCAL_RELEASE" | grep -Fq '${{ github.sha }}'; then
              echo "  ERROR: PM2 is not serving the synchronized release"
              exit 1
            fi
            echo "  PM2 release identity confirmed"

            echo "HV_DEPLOY_COMPLETE"

            echo "═══════════════════════════════════════════"
            echo "  Deploy Complete"
            echo "═══════════════════════════════════════════"
          DEPLOYSCRIPT
          )
          echo "$OUTPUT"
          if ! echo "$OUTPUT" | grep -q "HV_DEPLOY_COMPLETE"; then
            echo "ERROR: Deployment did not complete — HV_DEPLOY_COMPLETE not found in output"
            exit 1
          fi
          echo "Deployment sentinel confirmed."

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -so /dev/null -w "%{http_code}" https://www.hotelsvendors.com/api/health || echo "000")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "  Health check passed (HTTP $HTTP_STATUS)"
          else
            echo "  ERROR: Health check returned HTTP $HTTP_STATUS"
            exit 1
          fi

          LIVE_RELEASE=$(curl -fsS --retry 3 https://www.hotelsvendors.com/release.json)
          if ! printf '%s' "$LIVE_RELEASE" | grep -Fq '${{ github.sha }}'; then
            echo "  ERROR: Public domain is not serving deployed commit ${{ github.sha }}"
            exit 1
          fi

          if ! curl -fsS --retry 3 https://www.hotelsvendors.com/ | grep -Fq 'Find the money leaks before they become expensive.'; then
            echo "  ERROR: Public domain is not serving the expected production homepage"
            exit 1
          fi

          echo "  Public release identity and production homepage confirmed."
