name: Deploy to Hostinger VPS (Native)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Native Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Native Deploy to VPS
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'EOF'
            set -e
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Native Auto Deploy Started"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: PM2 + Bare Metal"
            echo "═══════════════════════════════════════════"

            # 1. Navigate to project root
            cd /var/www/hotels-vendors

            # 2. Pull latest code
            echo "[1/6] Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Install dependencies
            echo "[2/6] Installing dependencies..."
            npm ci --legacy-peer-deps

            # 4. Database migrations
            echo "[3/6] Running Prisma migrations..."
            npx prisma migrate deploy

            # 5. Production build
            echo "[4/6] Building application..."
            npm run build

            # 6. PM2 Reload
            echo "[5/6] Reloading application with PM2..."
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production

            echo "[6/6] Health check..."
            sleep 5
            curl -sI http://localhost:3000/api/health | grep "200 OK" || echo "Warning: Health check failed"

            echo "═══════════════════════════════════════════"
            echo "  Native Deploy Complete"
            echo "═══════════════════════════════════════════"
          EOF

      - name: Verify deployment
        run: |
          sleep 10
          curl -sfI https://www.hotelsvendors.com/api/health || echo "Health check failed — check server logs"

