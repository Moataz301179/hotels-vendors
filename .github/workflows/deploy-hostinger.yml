name: Deploy to Hostinger VPS (PM2)

on:
  push:
    branches: [main]
  workflow_dispatch:        # allows manual runs from the UI

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Deploy to Hostinger VPS (PM2)
        env:
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_KEY:  ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_IP:       ${{ secrets.HOSTINGER_IP }}
          HOSTINGER_TARGET_DIR: /public
        run: |
          bash ./deploy/hostinger-deploy.sh

      - name: Verify deployment health
        run: |
          curl -sfI https://www.hotelsvendors.com/api/health || exit 1
