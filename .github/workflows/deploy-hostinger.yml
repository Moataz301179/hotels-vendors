name: Deploy to Hostinger VPS (Native - Hard Reset)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Forced Native Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Forced Deploy to VPS
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'EOF'
            set -e
            echo "═══════════════════════════════════════════"
            echo "  FORCED DEPLOYMENT STARTED"
            echo "═══════════════════════════════════════════"

            # 1. Go to the root where .git lives
            cd /var/www/hotels-vendors
            
            echo "[1/7] Updating source code..."
            git fetch origin main
            git reset --hard origin/main

            # 2. Resolve the 'current' symlink problem
            # We ensure the code is updated in the root, and we update the symlink to point to root
            # (Simplifying the structure to avoid release-folder confusion)
            ln -sfn /var/www/hotels-vendors /var/www/hotels-vendors/current
            cd /var/www/hotels-vendors/current

            echo "[2/7] Cleaning old modules..."
            rm -rf node_modules

            echo "[3/7] Installing dependencies..."
            npm ci --legacy-peer-deps

            echo "[4/7] Database migrations..."
            npx prisma generate
            npx prisma migrate deploy

            echo "[5/7] Production build..."
            npm run build

            echo "[6/7] HARD RESTART of application..."
            # Delete process to clear memory and force new code load
            pm2 delete hotels-vendors || true
            pm2 start ecosystem.config.js --env production
            pm2 save

            echo "[7/7] Verifying update..."
            sleep 10
            curl -sI http://localhost:3000/api/health | grep "200 OK" || (echo "HEALTH CHECK FAILED" && exit 1)

            echo "═══════════════════════════════════════════"
            echo "  DEPLOYMENT VERIFIED AND LIVE"
            echo "═══════════════════════════════════════════"
          EOF

      - name: Verify deployment
        run: |
          sleep 15
          curl -sfI https://www.hotelsvendors.com/api/health || echo "Health check failed — check server logs"

