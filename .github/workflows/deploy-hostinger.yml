name: Deploy to Hostinger VPS (PM2)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Manual deploy only — auto-deploy handled by deploy.yml (Deploy to Production)"
        required: false

jobs:
  deploy:
    name: Build & Deploy to Hostinger (PM2)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS (PM2 + Standalone)
        run: |
          ssh ${{ secrets.HOSTINGER_USER }}@${{ secrets.HOSTINGER_IP }} << 'EOF'
            set -e
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Auto Deploy Started"
            echo "  Commit: ${{ github.sha }}"
            echo "  Method: PM2 + Next.js Standalone"
            echo "═══════════════════════════════════════════"

            cd /var/www/hotelsvendors-v2

            echo "[1/5] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/5] Installing dependencies..."
            npm ci --legacy-peer-deps

            echo "[3/5] Generating Prisma client..."
            npx prisma generate

            echo "[4/5] Building application (standalone)..."
            NEXT_TELEMETRY_DISABLED=1 npm run build

            echo "[5/5] Restarting PM2 process..."
            # Ensure static assets + public + env are available to the standalone server (nginx serves /_next/static from here)
            if [ ! -d .next/standalone/.next/static ]; then
              mkdir -p .next/standalone/.next
              cp -r .next/static .next/standalone/.next/static
            fi
            if [ ! -d .next/standalone/public ] && [ -d public ]; then
              cp -r public .next/standalone/public
            fi
            if [ ! -f .next/standalone/.env ] && [ -f .env ]; then
              cp .env .next/standalone/.env
            fi
            if pm2 describe hotels-vendors > /dev/null 2>&1; then
              pm2 reload ecosystem.config.js --env production
            else
              pm2 start ecosystem.config.js --env production
            fi
            pm2 save

            echo "═══════════════════════════════════════════"
            echo "  Deploy Complete"
            echo "═══════════════════════════════════════════"
          EOF

      - name: Verify deployment
        run: |
          sleep 15
          curl -sfI https://www.hotelsvendors.com/api/health || echo "Health check failed — check server logs"
