name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
        default: "deploy"

jobs:
  deploy:
    name: Build & Deploy to Hostinger (PM2 + SSH)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false

      - name: Add Hostinger to known hosts
        run: |
          mkdir -p ~/.ssh
          # Use the hostname (resolves to current VPS IP — no need to track IP changes)
          ssh-keyscan -H hotelsvendors.com >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh-keyscan -H ${{ secrets.HOSTINGER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS (PM2 — NO Docker)
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@hotelsvendors.com << 'EOF'
            set -e
            echo "═══════════════════════════════════════════"
            echo "  Hotels Vendors — Auto Deploy Started"
            echo "  Method: PM2 (native Next.js, NO Docker)"
            echo "  Path:   /var/www/hotelsvendors-v2"
            echo "  Port:   3003"
            echo "═══════════════════════════════════════════"

            cd /var/www/hotelsvendors-v2

            echo "[1/6] Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "[2/6] Installing dependencies..."
            npm ci --legacy-peer-deps --include=dev

            echo "[3/6] Generating Prisma client..."
            npx prisma generate

            echo "[4/6] Running migrations..."
            npx prisma migrate deploy

            echo "[5/6] Building (native Next.js, max-old-space 1536)..."
            rm -rf .next
            NODE_OPTIONS="--max-old-space-size=1536" node node_modules/next/dist/bin/next build

            echo "[6/6] Restarting PM2 process 'hotels-vendors'..."
            pm2 reload hotels-vendors 2>/dev/null || pm2 start "node node_modules/next/dist/bin/next start" --name hotels-vendors --env production -- --port 3003
            pm2 save

            sleep 4
            echo "═══════════════════════════════════════════"
            echo "  Health check..."
            curl -sf http://127.0.0.1:3003/api/health | head -c 300 || echo "  WARN: health check failed"
            echo ""
            echo "  Deploy Complete — production commit:"
            git log -1 --oneline
            echo "═══════════════════════════════════════════"
          EOF

      - name: Verify public endpoint
        run: |
          sleep 5
          echo "Public health check:"
          curl -sfI https://www.hotelsvendors.com/api/health | head -3 || echo "WARN: public health check failed"
          echo ""
          echo "Production commit (should match ${{ github.sha }}):"
          ssh -o StrictHostKeyChecking=accept-new root@hotelsvendors.com "cd /var/www/hotelsvendors-v2 && git log -1 --oneline" || echo "Could not verify commit"
