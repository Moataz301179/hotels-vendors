name: Release verified HotelsVendors update
on:
  push:
    branches: [diagnostics/production-release-20261005]
    paths: [.github/workflows/release-verified.yml]
permissions:
  contents: read
concurrency:
  group: hotelsvendors-verified-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dW5pdGVkLXRyZWVmcm9nLTIyMy5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_placeholder
      SESSION_SECRET: ci-only-not-used-by-clerk
      NEXT_PUBLIC_APP_URL: https://www.hotelsvendors.com
      NEXT_TELEMETRY_DISABLED: "1"
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Moataz301179/hotels-vendors-platform
          ref: a669f66a82c9cd1fb5a8867598c4e4acfa0cff04
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npm test
      - run: npm run build
      - name: Package and verify standalone
        run: |
          set -euo pipefail
          mkdir -p release/.next
          cp -a .next/standalone/. release/
          cp -a .next/static release/.next/static
          cp -a public release/public
          node -e 'const fs=require("fs");fs.writeFileSync("release/public/release.json",JSON.stringify({commit:"a669f66a82c9cd1fb5a8867598c4e4acfa0cff04",buildId:fs.readFileSync(".next/BUILD_ID","utf8").trim()}))'
          PORT=3100 HOSTNAME=127.0.0.1 NODE_ENV=production node release/server.js >/tmp/hv-release-smoke.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do
            curl -fsS --max-time 2 http://127.0.0.1:3100/api/health >/tmp/health.json && break || true
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          for route in / /login /register /marketplace /platform /solutions /release.json; do
            test "$(curl -sS --max-time 20 -o /tmp/page -w '%{http_code}' "http://127.0.0.1:3100$route")" = 200
          done
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/demand-aggregation)" = 307
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v2/demand)" = 401
          tar -czf hv-release.tgz -C release .
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: hv-release.tgz
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_SSH_KEY }}
          log-public-key: false
      - name: Stage release without changing the live process
        env:
          VPS_USER: ${{ secrets.HOSTINGER_USER }}
          VPS_HOST: ${{ secrets.HOSTINGER_IP }}
        run: |
          scp -o StrictHostKeyChecking=accept-new hv-release.tgz "$VPS_USER@$VPS_HOST:/tmp/hv-a669f66.tgz"
          ssh -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" 'node -' <<'RELEASE'
          const fs=require('fs'),cp=require('child_process'),path=require('path');
          const sha='a669f66a82c9cd1fb5a8867598c4e4acfa0cff04';
          const oldDir='/var/www/hv-releases/premium-fa0b81d77290-20261005';
          const dir='/var/www/hv-releases/premium-'+sha.slice(0,12)+'-20261005';
          const pm2=(...args)=>cp.execFileSync('pm2',args,{stdio:'pipe'});
          const processes=JSON.parse(pm2('jlist').toString());
          const old=processes.find(p=>p.name==='hotels-vendors-production');
          if(!old||old.pm2_env.pm_cwd!==oldDir||String(old.pm2_env.PORT)!=='3029')throw Error('Production identity changed; refusing replacement');
          if(fs.existsSync(dir))throw Error('Release directory already exists');
          if(processes.some(p=>p.name==='hotels-vendors-release-candidate'))throw Error('Candidate process already exists');
          fs.mkdirSync(dir,{mode:0o755});
          cp.execFileSync('tar',['-xzf','/tmp/hv-a669f66.tgz','-C',dir]);
          fs.copyFileSync(oldDir+'/.env',dir+'/.env');
          fs.chmodSync(dir+'/.env',0o600);
          const env={};
          for(const line of fs.readFileSync(dir+'/.env','utf8').split('\n')) {
            const m=line.match(/^([A-Z_0-9]+)=(.*)$/);
            if(m)env[m[1]]=m[2].trim().replace(/^["']|["']$/g,'');
          }
          for(const k of ['DATABASE_URL','CLERK_SECRET_KEY','NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY','SESSION_SECRET','REDIS_URL','HOTELSVENDORS_HMAC_SECRET','ENCRYPTION_MASTER_KEY']) if(old.pm2_env[k])env[k]=old.pm2_env[k];
          if(!env.DATABASE_URL||!env.SESSION_SECRET||!env.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)throw Error('Working environment incomplete');
          if(['localhost','127.0.0.1','::1'].includes(new URL(env.DATABASE_URL).hostname))throw Error('Refusing loopback database');
          const release=JSON.parse(fs.readFileSync(dir+'/public/release.json','utf8'));
          if(release.commit!==sha)throw Error('Wrong source artifact');
          const config=(name,cwd,port)=>({name,script:cwd+'/server.js',cwd,env:{...env,PORT:String(port),HOSTNAME:'127.0.0.1',NODE_ENV:'production'},autorestart:true});
          const candidateFile=dir+'/candidate.config.json';
          const productionFile=dir+'/production.config.json';
          const rollbackFile=dir+'/rollback.config.json';
          for(const [file,app] of [[candidateFile,config('hotels-vendors-release-candidate',dir,3030)],[productionFile,config('hotels-vendors-production',dir,3029)],[rollbackFile,config('hotels-vendors-production',oldDir,3029)]]) {
            fs.writeFileSync(file,JSON.stringify({apps:[app]}),{mode:0o600});
          }
          const check=async(port)=>{
            for(let n=0;n<30;n++){try{const r=await fetch('http://127.0.0.1:'+port+'/api/health');if(r.ok)break;}catch{}await new Promise(r=>setTimeout(r,500));}
            for(const route of ['/','/login','/register','/marketplace','/platform','/solutions','/security-overview','/hotels/signup','/suppliers/signup','/carriers/portal','/funders/portal','/solutions/hotels','/solutions/suppliers','/solutions/carriers','/solutions/funders','/api/health']) {
              const r=await fetch('http://127.0.0.1:'+port+route,{redirect:'manual',signal:AbortSignal.timeout(15000)});
              if(r.status!==200)throw Error('Runtime route failed '+route+' '+r.status);
            }
            const home=await (await fetch('http://127.0.0.1:'+port+'/')).text();
            if(!home.includes('Source smarter.')||!home.includes('HV Volume Deals')||!home.includes('Market Compass'))throw Error('Homepage regression');
            const css=home.match(/href="([^"]+\.css[^"]*)"/);
            if(!css||!(await fetch('http://127.0.0.1:'+port+css[1])).ok)throw Error('CSS missing');
            if(!(await fetch('http://127.0.0.1:'+port+'/hero-clean.jpeg')).ok)throw Error('Hero photograph missing');
            if(!(await fetch('http://127.0.0.1:'+port+'/_next/image?url=%2Fhero-clean.jpeg&w=1080&q=75')).ok)throw Error('Responsive image optimization failed');
            for(const [route,status] of [['/demand-aggregation',307],['/dashboard',307],['/orders',307],['/suppliers',307],['/admin',307],['/audit',307],['/security',307],['/api/v2/audit',401],['/api/v2/funders',401],['/api/v2/demand',401],['/api/v2/catalog',401],['/api/v2/orders',401],['/api/v2/dashboard',401],['/api/v2/suppliers/verification',401]]) {
              const r=await fetch('http://127.0.0.1:'+port+route,{redirect:'manual'});
              if(r.status!==status)throw Error('Access protection regression '+route);
            }
          };
          (async()=>{
            let switched=false;
            try{
              const {Client}=require(dir+'/node_modules/pg');
              const db=new Client({connectionString:env.DATABASE_URL,connectionTimeoutMillis:10000});
              try {
                await db.connect();
                const {Prisma}=require(dir+'/node_modules/@prisma/client');
                const names=['User','Tenant','Role','Supplier','Hotel','Property','Product','RfqRequest','ProcurementQuote','Order','OrderItem','AuthorityRule','AuditLog','Opportunity','EvidenceRecord','SavingsLedger','Invoice','CarrierProfile','FactoringCompany','FactoringRequest','Shipment','OnboardingProgress'];
                const r=await db.query("SELECT table_name,column_name FROM information_schema.columns WHERE table_schema='public'");
                const columns=new Set(r.rows.map(r=>r.table_name+'.'+r.column_name));
                for(const model of Prisma.dmmf.datamodel.models.filter(m=>names.includes(m.name)))for(const f of model.fields.filter(f=>f.kind!=='object'))if(!columns.has((model.dbName||model.name)+'.'+(f.dbName||f.name)))throw Error('Production schema missing '+model.name+'.'+f.name);
              } finally { await db.end(); }
              console.log('Database read-only preflight passed');
              pm2('start',candidateFile);
              await check(3030);
              console.log('Candidate smoke checks passed; preserved rollback '+oldDir);
              pm2('delete','hotels-vendors-release-candidate');
              switched=true;
              pm2('delete','hotels-vendors-production');
              pm2('start',productionFile);
              await check(3029);
              const local=await (await fetch('http://127.0.0.1:3029/release.json')).json();
              if(local.commit!==sha)throw Error('Local release identity mismatch');
              const publicRelease=await (await fetch('https://www.hotelsvendors.com/release.json',{signal:AbortSignal.timeout(15000)})).json();
              if(publicRelease.commit!==sha)throw Error('Public release identity mismatch');
              pm2('save');
              console.log('DEPLOY_VERIFIED '+sha+' BUILD '+release.buildId+' PORT 3029');
            }catch(e){
              try{pm2('delete','hotels-vendors-release-candidate');}catch{}
              if(switched){try{pm2('delete','hotels-vendors-production');}catch{}pm2('start',rollbackFile);pm2('save');console.log('Previous production restored');}
              console.error('Release halted: '+e.message);process.exitCode=1;
            }
          })();
          RELEASE
